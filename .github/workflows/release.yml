name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. "1.2.0" (leading "v" optional). Leave empty to auto-generate.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-rc.${RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (tag: v${VERSION})"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - run: npm ci

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FLUENTEDGE_RELEASE_KEYSTORE }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/fluentedge-release.keystore

      - name: Write signing properties
        env:
          STORE_PASSWORD: ${{ secrets.FLUENTEDGE_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUENTEDGE_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FLUENTEDGE_RELEASE_KEY_PASSWORD }}
        run: |
          printf '\nFLUENTEDGE_UPLOAD_STORE_FILE=fluentedge-release.keystore\nFLUENTEDGE_UPLOAD_STORE_PASSWORD=%s\nFLUENTEDGE_UPLOAD_KEY_ALIAS=%s\nFLUENTEDGE_UPLOAD_KEY_PASSWORD=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" >> "$HOME/.gradle/gradle.properties"

      - name: Build release APK
        working-directory: android
        run: >-
          ./gradlew assembleRelease
          -PfluentedgeVersionName=${{ steps.ver.outputs.version }}
          -PfluentedgeVersionCode=${{ github.run_number }}
          --build-cache
          --no-configuration-cache

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: ${{ steps.ver.outputs.tag }}
          name: FluentEdge v${{ steps.ver.outputs.version }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
